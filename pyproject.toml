[project]
name = "py-decision"
version = "0.1.0"
description = "A typed Python server with a Bun/Vite client."
authors = [
    { name = "Olivier Rousseau-Guyot", email = "zeachco@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
py-decision = "py_decision:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["py_decision"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
